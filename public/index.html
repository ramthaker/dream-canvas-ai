<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamCanvas</title><link rel="stylesheet" href="styles.css"></head><body><main><p class="eyebrow">DREAMCANVAS · AUTONOMOUS BEDTIME STORIES</p><h1>A little story is waiting.</h1><p class="lede">A fresh, gentle adventure arrives every evening at eight.</p><section id="setup" class="card"><h2>Make bedtime personal</h2><form id="profile"><label>Child's first name<input name="childName" required></label><label>Age<input name="age" type="number" min="2" max="12" value="6"></label><label>Favorite themes<input name="themes" placeholder="moon, foxes, stars"></label><label>Your email<input name="email" type="email" required></label><button>Save bedtime profile</button><p id="status"></p></form></section><section id="stories"></section></main><script src="app.js"></script></body></html>
