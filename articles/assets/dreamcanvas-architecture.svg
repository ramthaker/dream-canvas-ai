<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><style>text{font-family:Arial,sans-serif;fill:#f8f3e8}.title{font-size:32px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:16px}.box{fill:#252744;stroke:#8d91c7;stroke-width:2}.aws{fill:#3e345d;stroke:#e5bd73;stroke-width:2}.line{stroke:#e5bd73;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15172c"/><stop offset="1" stop-color="#454577"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#e5bd73"/></marker></defs><rect width="1400" height="760" fill="url(#bg)"/><text x="70" y="70" class="title">DreamCanvas architecture</text><text x="70" y="105" class="small">An always-on bedtime story prepared before the parent opens the reader</text><rect x="70" y="190" width="230" height="120" rx="18" class="box"/><text x="185" y="235" text-anchor="middle" class="label">Amplify Hosting</text><text x="185" y="270" text-anchor="middle" class="small">Setup + story reader</text><rect x="390" y="190" width="230" height="120" rx="18" class="aws"/><text x="505" y="235" text-anchor="middle" class="label">API Gateway</text><text x="505" y="270" text-anchor="middle" class="small">HTTP API</text><rect x="710" y="150" width="260" height="120" rx="18" class="aws"/><text x="840" y="195" text-anchor="middle" class="label">API Lambda</text><text x="840" y="230" text-anchor="middle" class="small">Profile, reader, test run</text><rect x="710" y="350" width="260" height="120" rx="18" class="aws"/><text x="840" y="395" text-anchor="middle" class="label">Story Lambda</text><text x="840" y="430" text-anchor="middle" class="small">Scheduled generation</text><rect x="70" y="530" width="230" height="120" rx="18" class="aws"/><text x="185" y="575" text-anchor="middle" class="label">EventBridge</text><text x="185" y="610" text-anchor="middle"