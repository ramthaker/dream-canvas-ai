<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430"><style>text{font-family:Arial,sans-serif;fill:#f8f3e8}.title{font-size:30px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:15px}.box{fill:#252744;stroke:#e5bd73;stroke-width:2}.line{stroke:#e5bd73;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><linearGradient id="bg" x2="1"><stop stop-color="#15172c"/><stop offset="1" stop-color="#454577"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#e5bd73"/></marker></defs><rect width="1400" height="430" fill="url(#bg)"/><text x="55" y="60" class="title">DreamCanvas generation flow</text><g transform="translate(55 145)"><rect width="180" height="120" rx="18" class="box"/><text x="90" y="45" text-anchor="middle" class="label">1. Tick</text><text x="90" y="78" text-anchor="middle" class="small">Every 15 minutes</text><text x="90" y="100" text-anchor="middle" class="small">or test button</text><rect x="260" width="180" height="120" rx="18" class="box"/><text x="350" y="45" text-anchor="middle" class="label">2. Check</text><text x="350" y="78" text-anchor="middle" class="small">Local time + profile</text><text x="350" y="100" text-anchor="middle" class="small">Skip when not due</text><rect x="520" width="180" height="120" rx="18" class="box"/><text x="610" y="45" text-anchor="middle" class="label">3. Create</text><text x="610" y="78" text-anchor="middle" class="small">Bedtime story</text><text x="610" y="100" text-anchor="middle" class="small">+ illustration</text><rect x="780" width="180" height="120" rx="18" class="box"/><text x="870" y="45" text-anchor="middle" class="label">4. Validate</text><text x="870" y="78" text-anchor="middle" class="small">Age + safety rules</text><text x="870" y="100" text-anchor="middle" class="small">Reject unsafe output</text><rect x="1040" width="180" height="120" rx="18" class="box"/><text x="1130" y="45" text-anchor="middle" class="label">5. Deliver</text><text x="1130" y="78" text-anchor="middle" class="small">DynamoDB + S3</text><text x="1130" y="100" text-anchor="middle" class="small">SES email</text><path d="M180 60H260M440 60H520M700 60H780M960 60H1040" class="line"/></g></svg>